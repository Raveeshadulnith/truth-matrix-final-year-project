<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truth Matrix - Deepfake Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="bg-canvas">
    <div class="bg-orb bg-orb--violet"></div>
    <div class="bg-orb bg-orb--indigo"></div>
    <div class="bg-orb bg-orb--teal"></div>
    <div class="noise-overlay"></div>
  </div>

  <main class="shell">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11 4C7.13 4 4 7.13 4 11s3.13 7 7 7 7-3.13 7-7-3.13-7-7-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" fill="url(#g1)"/>
            <circle cx="11" cy="11" r="2.5" fill="url(#g2)"/>
            <defs>
              <linearGradient id="g1" x1="4" y1="4" x2="18" y2="18" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a78bfa"/>
                <stop offset="1" stop-color="#38bdf8"/>
              </linearGradient>
              <linearGradient id="g2" x1="8.5" y1="8.5" x2="13.5" y2="13.5" gradientUnits="userSpaceOnUse">
                <stop stop-color="#c4b5fd"/>
                <stop offset="1" stop-color="#7dd3fc"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-label">TRUTH MATRIX</span>
          <span class="brand-sub">Deepfake Detection</span>
        </div>
      </div>
      <div class="status-badge" id="backendBadge">
        <span class="badge-dot"></span>
        <span class="badge-text">Local API</span>
      </div>
    </header>

    <!-- Main Content Area -->
    <section id="statusContainer" class="content-area" aria-live="polite"></section>

    <!-- History -->
    <section id="historyContainer" class="history-section"></section>

    <!-- Action Bar -->
    <footer class="action-bar">
      <button id="refreshButton" class="btn btn--ghost" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        Refresh
      </button>
      <button id="reanalyzeButton" class="btn btn--secondary" type="button" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Re-scan
      </button>
      <button id="clearButton" class="btn btn--danger" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Clear
      </button>
    </footer>
  </main>

  <script src="extension-shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
